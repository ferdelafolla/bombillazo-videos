name: Descargar audios
# Relevo: cuando se sube descargas/<nombre>.url con una URL firmada,
# descarga el archivo a voces/<nombre>.mp3 y lo guarda en el repositorio.
on:
  push:
    paths: ['descargas/*.url']
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p voces
          for f in descargas/*.url; do
            n=$(basename "$f" .url)
            [ -f "voces/$n.mp3" ] && continue
            curl -sSfL --retry 3 -o "voces/$n.mp3" "$(tr -d '\r\n' < "$f")" || echo "FALLO $n"
          done
          ls -la voces
      - name: Guardar
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add voces
          git diff --cached --quiet && exit 0
          git commit -m "Audios descargados"
          # si alguien sube a la vez, se integra y se reintenta
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 3))
            git pull --rebase origin main || exit 1
          done
          exit 1
